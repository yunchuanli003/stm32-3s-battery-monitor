; PlatformIO 工程配置 —— 3S 电池监测 WiFi 转发
; 板子：NodeMCU 1.0 (ESP-12E)  芯片：ESP8266
;
; 常用命令（在 ESP8266_WiFi 目录下执行）：
;   .venv/Scripts/pio.exe run                编译
;   .venv/Scripts/pio.exe run -t upload       编译并上传
;   .venv/Scripts/pio.exe device list         列出串口
;   .venv/Scripts/pio.exe device monitor      打开串口监视器

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; 上传和监视都用 115200，和 STM32 那边保持一致
upload_speed  = 115200
monitor_speed = 115200

; D1(mini) 等部分板子需要调低，这里 80MHz 稳妥
board_build.f_cpu = 80000000L
